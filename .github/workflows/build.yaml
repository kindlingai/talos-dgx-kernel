name: build

# Builds the installer image and ISO on a 16-vCPU Blacksmith arm64 runner. The
# build needs about 16 GB of memory and 60 GB of free disk.
#
# On a version tag (v*), the job publishes the release with `make release` and
# publish.yaml pushes the installer image. When the release already exists, the
# job instead checks that this build reproduces its OCI-DIGESTS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: talos-dgx-kernel
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Write module signing key
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "${MODULE_SIGNING_KEY}" > "${RUNNER_TEMP}/module-signing.pem"

      - name: Build
        run: make PROGRESS=plain SIGNING_KEY="${RUNNER_TEMP}/module-signing.pem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-dgx-kernel
          path: |
            _out/installer-arm64.tar
            _out/metal-arm64.iso
            _out/SHA256SUMS
            _out/OCI-DIGESTS

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release download "${GITHUB_REF_NAME}" --pattern OCI-DIGESTS --output - | diff - _out/OCI-DIGESTS
          else
            make release TAG="${GITHUB_REF_NAME}"
          fi

  publish:
    needs: build
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ github.ref_name }}
