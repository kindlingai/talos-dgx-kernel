name: build

# Builds the installer image and ISO. A version tag (v*) also pushes the
# installer image to GHCR and publishes the ISO in a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # Set the BUILD_RUNNER repository variable to use a larger or self-hosted runner.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: talos-dgx-kernel
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Write module signing key
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "${MODULE_SIGNING_KEY}" > "${RUNNER_TEMP}/module-signing.pem"

      - name: Build
        run: make PROGRESS=plain SIGNING_KEY="${RUNNER_TEMP}/module-signing.pem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-dgx-kernel
          path: |
            _out/installer-arm64.tar
            _out/metal-arm64.iso
            _out/SHA256SUMS

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        if: github.ref_type == 'tag'

      - name: Push installer image
        if: github.ref_type == 'tag'
        run: |
          make push TAG="${GITHUB_REF_NAME}"
          echo "Installer image: \`$(cat _out/installer.ref)\`" > _out/release.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.ref_type == 'tag'
        with:
          body_path: _out/release.md
          files: |
            _out/metal-arm64.iso
            _out/SHA256SUMS
