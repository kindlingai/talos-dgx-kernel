# Imager profile for the bootable installation ISO (`make iso`).
# Paths under /oci are the OCI layouts that `make kernel` and `make talos` export.
baseProfileName: iso
arch: arm64
platform: metal
secureboot: false
customization:
  extraKernelArgs:
    - -init_on_alloc
    - -nvme_core.io_timeout
    - arm64.nobti
    - pci=pcie_bus_safe
input:
  baseInstaller:
    imageRef: talos-dgx-kernel/installer
    ociPath: /oci/installer-base
  systemExtensions:
    - ociPath: /oci/nvidia-extension
    - ociPath: /oci/dispram-extension
    - imageRef: ghcr.io/siderolabs/nvidia-container-toolkit-lts@sha256:0ad95abe15402c9bcd21600079c46f2f14263cf469d1a5385d29417ddf03d001
output:
  kind: iso
  outFormat: raw
