# Imager profile for the Talos installer image (`make installer`).
# Paths under /oci are the OCI layouts that `make kernel` and `make talos` export.
baseProfileName: installer
arch: arm64
platform: metal
secureboot: false
customization:
  extraKernelArgs:
    - -init_on_alloc
    - -nvme_core.io_timeout
    - arm64.nobti
    - pci=pcie_bus_safe
input:
  baseInstaller:
    imageRef: talos-dgx-kernel/installer
    ociPath: /oci/talos/@PAGE@/installer-base
  systemExtensions:
    - ociPath: /oci/variants/@VARIANT@/nvidia-extension
    - ociPath: /oci/common/dispram-extension
    - ociPath: /oci/common/toolkit-extension
output:
  kind: installer
  outFormat: raw
